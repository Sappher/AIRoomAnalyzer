name: AI Analysis

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Codex CLI
        run: npm install -g @openai/codex
      - name: Run DocGen
        uses: Sappher/DocGen@beta-codex
        with:
          prompts-folder: docs/gen/prompts
          output-folder: docs/gen/docs
          openai-model: gpt-5.2-codex
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          enable-git: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-confluence: false
          confluence-base-url: "https://sappher.atlassian.net/wiki/"
          confluence-email: ${{ secrets.CONFLUENCE_EMAIL }}
          confluence-api-token: ${{ secrets.CONFLUENCE_API_TOKEN }}
          confluence-page-map: |
            GENERAL.MD=65780
            ARCHITECTURE.MD=98495
